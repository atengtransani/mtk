    .eyebrow {
      display: inline-flex;

      border-radius: 999px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .nav-chip,
    .action-button,
    .answer-button {
      transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease;
    }

    .nav-chip:hover,
    .action-button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 #000;
    }

    .nav-chip:active,
    .action-button:active {
      transform: translate(0, 0);
      box-shadow: 1px 1px 0 #000;
    }

    .focus-ring:focus-visible,
    .answer-button:focus-visible,
    a:focus-visible {
      outline: 4px solid #000;
      outline-offset: 4px;
    }

    .photo-frame {
      position: relative;
      overflow: hidden;
      border-bottom: 2px solid #000;
      aspect-ratio: 16 / 10;
      background: #ececec;
    }

    .photo-frame img {
      width: 100%;

      object-fit: cover;
      filter: saturate(.8) contrast(1.05);
      transition: transform .5s ease;
    }

    .story-card:hover img {
      transform: scale(1.045);

      display: inline-grid;

    }

    .fraction-bar {
      width: 100%;
      height: 3px;
      background: #000;

    .matrix-wrap {
      overflow-x: auto;
      border: 2px solid #000;
      box-shadow: 7px 7px 0 #000;
      background: #fff;
    }

    .problem-matrix {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
    }

    .problem-matrix th,
    .problem-matrix td {
      padding: 18px;
      text-align: left;
      vertical-align: top;
      border-right: 2px solid #000;
      border-bottom: 2px solid #000;
    }

    .problem-matrix th:last-child,
    .problem-matrix td:last-child {
      border-right: 0;
    }

    .problem-matrix tbody tr:last-child td {
      border-bottom: 0;
    }

    .problem-matrix thead {
      background: #000;
      color: #fff;
    }

    .problem-matrix tbody tr:nth-child(even) {
      background: #f4f4f0;
    }

    .step-line {
      display: flex;
      gap: .7rem;
      align-items: flex-start;
    }

    .step-number {
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
      display: grid;
      place-items: center;
      border: 2px solid #000;
      border-radius: 50%;
      font-weight: 800;
      background: #fff;
    }

    .quiz-option {
      width: 100%;
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .85rem 1rem;
      text-align: left;
      border: 2px solid #000;
      background: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .quiz-option:hover:not(:disabled) {
      background: #f6d743;
      transform: translateX(3px);
    }

    .quiz-option:disabled {
      cursor: default;
      opacity: 1;
    }

    .quiz-option.is-correct {
      background: #cbe8c7;
      box-shadow: inset 7px 0 0 #000;
    }

    .quiz-option.is-wrong {
      background: #ffd2a6;
      text-decoration: line-through;
    }

    .feedback-panel {
      display: none;
    }

    .quiz-card.answered .feedback-panel {
      display: block;
      animation: reveal .25s ease both;
    }

    .quiz-card.answered .quiz-option:not(.is-correct):not(.is-wrong) {
      opacity: .55;
    }

    .result-panel {
      display: none;
    }

    .result-panel.is-visible {
      display: flex;
      animation: reveal .35s ease both;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .reveal-item {
      animation: reveal .6s ease both;
    }

    .reveal-item:nth-child(2) { animation-delay: .08s; }
    .reveal-item:nth-child(3) { animation-delay: .16s; }

    .decorative-ring {
      position: absolute;
      border: 3px solid #000;
      border-radius: 50%;
      pointer-events: none;

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      document.querySelectorAll("[data-scroll-to]").forEach((button) => {
        button.addEventListener("click", () => {
          const target = document.getElementById(button.dataset.scrollTo);
          if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      });

      const quizCards = [...document.querySelectorAll(".quiz-card")];
      const resultPanel = document.getElementById("result-panel");
      const scoreValue = document.getElementById("score-value");
      const retryButton = document.getElementById("retry-button");
      let answered = 0;
      let score = 0;

      quizCards.forEach((card) => {
        const options = [...card.querySelectorAll(".quiz-option")];

        options.forEach((option) => {
          option.addEventListener("click", () => {
            if (card.classList.contains("answered")) return;

            const correct = option.dataset.correct === "true";
            card.classList.add("answered");
            answered += 1;

            options.forEach((item) => {
              item.disabled = true;
              if (item.dataset.correct === "true") item.classList.add("is-correct");
            });

            if (correct) {
              score += 1;
              card.querySelector(".correct-feedback").classList.remove("hidden");
            } else {
              option.classList.add("is-wrong");
              card.querySelector(".wrong-feedback").classList.remove("hidden");
            }

            if (answered === quizCards.length) {
              scoreValue.textContent = String(score);
              resultPanel.classList.add("is-visible");
            }
          });
        });
      });

      retryButton.addEventListener("click", () => {
        answered = 0;
        score = 0;
        scoreValue.textContent = "0";
        resultPanel.classList.remove("is-visible");

        quizCards.forEach((card) => {
          card.classList.remove("answered");
          card.querySelector(".correct-feedback").classList.add("hidden");
          card.querySelector(".wrong-feedback").classList.add("hidden");

          card.querySelectorAll(".quiz-option").forEach((option) => {
            option.disabled = false;
            option.classList.remove("is-correct", "is-wrong");
          });
        });

        document.getElementById("quick-practice").scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      });
    });
  </script>
